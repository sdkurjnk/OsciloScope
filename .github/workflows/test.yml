name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, develop]

# Cancel in-progress runs for the same ref (e.g. new push to a PR)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & compile
        run: npm run compile

      # vscode-test launches a headless VS Code instance, which needs a
      # virtual display on Linux runners.
      - name: Test
        run: xvfb-run -a npm test

      # Verify the extension packages cleanly (no publish). Catches issues
      # that lint/compile/test miss, e.g. template README, missing files.
      - name: Verify packaging
        run: npx --yes @vscode/vsce package --out /tmp/verify.vsix
