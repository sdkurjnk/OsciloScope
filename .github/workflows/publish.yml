name: publish

on:
  release:
    types: [published]

# Only one publish at a time
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Open VSX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # package.json is the single source of truth for the version. Read it
      # (independent of the release tag) and reuse it for the artifact name.
      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # Fast sanity gate before shipping (full test suite runs in CI).
      - name: Lint
        run: npm run lint

      # `vsce package` triggers `vscode:prepublish` (webpack production build)
      # and produces the .vsix artifact, named with the package.json version.
      - name: Package extension
        run: npx --yes @vscode/vsce package --out "osciloscope-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to Open VSX
        run: npx --yes ovsx publish "osciloscope-${{ steps.version.outputs.version }}.vsix" -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
