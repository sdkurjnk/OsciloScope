name: CD

on:
  release:
    types: [published]

# Only one publish at a time
concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Open VSX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # Tag-driven versioning: the release tag (vX.Y.Z) is the single source of
      # truth. Resolve the version from it and inject it into package.json so
      # `vsce package` embeds the right version. The script validates the tag is
      # a strict vX.Y.Z and fails otherwise. RELEASE_TAG is passed via env (not
      # inline ${{ }}) to avoid script injection.
      - name: Resolve version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Assign first so a bad tag (script exit 1) fails the step. In an
          # `echo "v=$(cmd)"` form the substitution's failure is masked by echo.
          version="$(node scripts/resolve-version.mjs --write)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # Fast sanity gate before shipping (full test suite runs in CI).
      - name: Lint
        run: npm run lint

      # `vsce package` triggers `vscode:prepublish` (webpack production build)
      # and produces the .vsix artifact, named with the package.json version.
      - name: Package extension
        run: npx --yes @vscode/vsce package --out "osciloscope-${{ steps.version.outputs.version }}.vsix"

      - name: Publish to Open VSX
        run: npx --yes ovsx publish "osciloscope-${{ steps.version.outputs.version }}.vsix" -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
