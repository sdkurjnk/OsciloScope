<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VML Visualizer</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #4f8ef7;
      --accent2: #a78bfa;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --success: #34d399;
      --warning: #fbbf24;
      --error: #f87171;
      --sidebar-w: 240px;
      --header-h: 44px;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-ui: 'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    #header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
    }
    #header .logo {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
    }
    #header .logo span { color: var(--accent2); }
    #status-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    #status-badge.connected { color: var(--success); border-color: var(--success); }
    #status-badge.loading   { color: var(--warning); border-color: var(--warning); }

    /* ── MAIN LAYOUT ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 10px 12px 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #sidebar-list {
      overflow-y: auto;
      flex: 1;
      padding: 6px 0;
    }
    #sidebar-list::-webkit-scrollbar { width: 4px; }
    #sidebar-list::-webkit-scrollbar-track { background: transparent; }
    #sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .scope-group {}
    .scope-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .scope-label:hover { background: var(--surface2); }
    .scope-label .chevron {
      font-size: 9px;
      transition: transform 0.2s;
      color: var(--text-muted);
    }
    .scope-label .scope-icon { color: var(--accent2); font-size: 12px; }
    .scope-group.collapsed .chevron { transform: rotate(-90deg); }
    .scope-group.collapsed .var-list { display: none; }

    .var-list {}
    .var-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px 4px 28px;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.1s;
      border-left: 2px solid transparent;
    }
    .var-item:hover { background: var(--surface2); }
    .var-item.active {
      background: rgba(79,142,247,0.1);
      border-left-color: var(--accent);
      color: var(--accent);
    }
    .var-item .var-type {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent2);
      opacity: 0.8;
      min-width: 28px;
    }
    .var-item .var-name {
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── CONTENT ── */
    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* ── TIMELINE HEADER ── */
    #timeline-header {
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #tl-var-name {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    #tl-scope-badge {
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(167,139,250,0.12);
      color: var(--accent2);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 4px;
      font-family: var(--font-mono);
    }
    #tl-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── TIMELINE BODY ── */
    #timeline-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
    #timeline-body::-webkit-scrollbar { width: 6px; }
    #timeline-body::-webkit-scrollbar-track { background: transparent; }
    #timeline-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* COLUMN HEADERS */
    .tl-col-header {
      display: grid;
      grid-template-columns: 60px 1fr 140px 100px;
      gap: 0;
      padding: 0 0 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .tl-col-header span {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 8px;
    }

    /* ROW */
    .tl-row {
      display: grid;
      grid-template-columns: 60px 1fr 140px 100px;
      gap: 0;
      min-height: 32px;
      align-items: stretch;
      border-bottom: 1px solid rgba(46,51,80,0.5);
      transition: background 0.1s;
    }
    .tl-row:hover { background: rgba(255,255,255,0.02); }
    .tl-row:last-child { border-bottom: none; }

    .tl-cell {
      padding: 6px 8px;
      display: flex;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    /* step number */
    .tl-cell.step {
      color: var(--text-muted);
      font-size: 11px;
      justify-content: flex-end;
      padding-right: 12px;
    }

    /* value bar cell */
    .tl-cell.value {
      position: relative;
      gap: 8px;
    }
    .value-bar-wrap {
      flex: 1;
      height: 18px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .value-bar {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      opacity: 0.7;
    }
    .value-bar.negative {
      background: linear-gradient(90deg, var(--error), #f472b6);
    }
    .value-text {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      min-width: 60px;
      text-align: right;
    }

    /* line / change */
    .tl-cell.line {
      color: var(--text-dim);
      font-size: 11px;
    }
    .tl-cell.change {}
    .change-badge {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      font-family: var(--font-mono);
    }
    .change-badge.inc { background: rgba(52,211,153,0.12); color: var(--success); }
    .change-badge.dec { background: rgba(248,113,113,0.12); color: var(--error); }
    .change-badge.new { background: rgba(79,142,247,0.12); color: var(--accent); }
    .change-badge.same { color: var(--text-muted); background: transparent; }

    /* ── EMPTY / PLACEHOLDER ── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
    }
    #empty-state .icon { font-size: 32px; opacity: 0.3; }
    #empty-state p { font-size: 12px; }

    /* ── LOADING OVERLAY ── */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15,17,23,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      display: none;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div class="logo">VML<span>·</span>Visualizer</div>
  <div id="status-badge">대기 중</div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-header">Variables</div>
    <div id="sidebar-list">
      <!-- SidebarManager가 렌더링 -->
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content">
    <div id="timeline-header" style="display:none;">
      <span id="tl-var-name">—</span>
      <span id="tl-scope-badge">—</span>
      <span id="tl-count"></span>
    </div>

    <div id="timeline-body">
      <div id="empty-state">
        <div class="icon">◈</div>
        <p>사이드바에서 변수를 선택하세요</p>
      </div>
      <!-- TimelineViewer가 렌더링 -->
    </div>
  </div>
</div>

<div id="loading-overlay"><div class="spinner"></div></div>

<script>
'use strict';

/* ────────────────────────────────────────────────
   CommandTypes  (enumeration)
──────────────────────────────────────────────── */
const CommandTypes = Object.freeze({
  UPDATE_ALL_DATA:  'UPDATE_ALL_DATA',   // 백엔드 → 프론트: 전체 데이터 전달
  VARIABLE_CHANGED: 'VARIABLE_CHANGED',  // 프론트 → 백엔드: 선택 변수 변경
  UI_READY:         'UI_READY',          // 프론트 → 백엔드: 로드 완료
});

/* ────────────────────────────────────────────────
   DataManager
──────────────────────────────────────────────── */
class DataManager {
  constructor() {
    this._data = {};           // { scopeId: [ {varName, type, history:[{step,line,value}]} ] }
    this._currentVarName = null;
  }

  updateData(newData) {
    this._data = newData || {};
  }

  /** 사이드바용: { scopeId: [{varName, type}] } */
  getGroupedData() {
    const result = {};
    for (const [scope, vars] of Object.entries(this._data)) {
      result[scope] = vars.map(v => ({ varName: v.varName, type: v.type }));
    }
    return result;
  }

  /** 타임라인용: 해당 변수의 history 배열 반환 */
  getTimelineByVar(varName) {
    for (const vars of Object.values(this._data)) {
      const found = vars.find(v => v.varName === varName);
      if (found) return { history: found.history, type: found.type, scope: found.scope };
    }
    return null;
  }

  /** 변수가 속한 scope 반환 */
  getScopeByVar(varName) {
    for (const [scope, vars] of Object.entries(this._data)) {
      if (vars.find(v => v.varName === varName)) return scope;
    }
    return '—';
  }

  get currentVarName() { return this._currentVarName; }
  set currentVarName(v) { this._currentVarName = v; }
}

/* ────────────────────────────────────────────────
   SidebarManager
──────────────────────────────────────────────── */
class SidebarManager {
  constructor(onSelectVar) {
    this._listEl = document.getElementById('sidebar-list');
    this._onSelectVar = onSelectVar;   // callback(varName)
    this._activeEl = null;
  }

  renderSidebar(groupedData) {
    this._listEl.innerHTML = '';
    if (!groupedData || Object.keys(groupedData).length === 0) {
      this._listEl.innerHTML = '<div style="padding:12px;color:var(--text-muted);font-size:12px;">데이터 없음</div>';
      return;
    }

    for (const [scopeId, vars] of Object.entries(groupedData)) {
      const group = document.createElement('div');
      group.className = 'scope-group';
      group.dataset.scopeId = scopeId;

      const label = document.createElement('div');
      label.className = 'scope-label';
      label.innerHTML = `<span class="scope-icon">⬡</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${scopeId}</span>
        <span class="chevron">▾</span>`;
      label.addEventListener('click', () => this.toggleScope(scopeId));

      const varList = document.createElement('div');
      varList.className = 'var-list';

      for (const { varName, type } of vars) {
        const item = document.createElement('div');
        item.className = 'var-item';
        item.dataset.varName = varName;
        item.innerHTML = `<span class="var-type">${type || '?'}</span>
          <span class="var-name">${varName}</span>`;
        item.addEventListener('click', () => {
          this.setActiveVariable(item);
          this._onSelectVar(varName);
        });
        varList.appendChild(item);
      }

      group.appendChild(label);
      group.appendChild(varList);
      this._listEl.appendChild(group);
    }
  }

  toggleScope(scopeId) {
    const group = this._listEl.querySelector(`[data-scope-id="${scopeId}"]`);
    if (group) group.classList.toggle('collapsed');
  }

  setActiveVariable(element) {
    if (this._activeEl) this._activeEl.classList.remove('active');
    this._activeEl = element;
    element.classList.add('active');
  }
}

/* ────────────────────────────────────────────────
   TimelineViewer
──────────────────────────────────────────────── */
class TimelineViewer {
  constructor() {
    this._container = document.getElementById('timeline-body');
    this._headerEl  = document.getElementById('timeline-header');
    this._varNameEl = document.getElementById('tl-var-name');
    this._scopeEl   = document.getElementById('tl-scope-badge');
    this._countEl   = document.getElementById('tl-count');
  }

  renderHeader(varName, scope) {
    this._headerEl.style.display = 'flex';
    this._varNameEl.textContent  = varName;
    this._scopeEl.textContent    = scope || '—';
  }

  renderTimeline(rows) {
    this._container.innerHTML = '';
    if (!rows || rows.length === 0) {
      this._container.innerHTML = '<div style="padding:24px;color:var(--text-muted)">기록된 변경사항이 없습니다.</div>';
      this._countEl.textContent = '';
      return;
    }

    this._countEl.textContent = `${rows.length}회 변경`;

    /* 수치 범위 계산 (bar 비율용) */
    const numericVals = rows.map(r => parseFloat(r.value)).filter(n => !isNaN(n));
    const maxAbs = numericVals.length ? Math.max(...numericVals.map(Math.abs), 1) : 1;

    /* 컬럼 헤더 */
    const colHeader = document.createElement('div');
    colHeader.className = 'tl-col-header';
    colHeader.innerHTML = `<span>#</span><span>값</span><span>라인</span><span>변화</span>`;
    this._container.appendChild(colHeader);

    /* 행 */
    rows.forEach((row, idx) => {
      const prev = idx > 0 ? rows[idx - 1].value : null;
      const changeLabel = this._calcChange(prev, row.value, idx);

      const el = document.createElement('div');
      el.className = 'tl-row';

      const numVal = parseFloat(row.value);
      const isNum  = !isNaN(numVal);
      const pct    = isNum ? Math.min((Math.abs(numVal) / maxAbs) * 100, 100) : 0;
      const isNeg  = numVal < 0;

      el.innerHTML = `
        <div class="tl-cell step">${row.step ?? idx + 1}</div>
        <div class="tl-cell value">
          ${isNum
            ? `<div class="value-bar-wrap"><div class="value-bar ${isNeg ? 'negative' : ''}" style="width:${pct}%"></div></div>`
            : ''}
          <span class="value-text">${this._formatValue(row.value)}</span>
        </div>
        <div class="tl-cell line">${row.line != null ? `L${row.line}` : '—'}</div>
        <div class="tl-cell change"><span class="change-badge ${changeLabel.cls}">${changeLabel.text}</span></div>
      `;

      this._container.appendChild(el);
    });
  }

  clearTimeline() {
    this._container.innerHTML = `
      <div id="empty-state">
        <div class="icon">◈</div>
        <p>사이드바에서 변수를 선택하세요</p>
      </div>`;
    this._headerEl.style.display = 'none';
    this._countEl.textContent = '';
  }

  _formatValue(v) {
    if (v === null || v === undefined) return '—';
    if (typeof v === 'string' && v.length > 40) return v.slice(0, 40) + '…';
    return String(v);
  }

  _calcChange(prev, curr, idx) {
    if (idx === 0) return { cls: 'new', text: 'init' };
    const pn = parseFloat(prev), cn = parseFloat(curr);
    if (!isNaN(pn) && !isNaN(cn)) {
      const diff = cn - pn;
      if (diff === 0) return { cls: 'same', text: '±0' };
      const sign = diff > 0 ? '+' : '';
      return diff > 0
        ? { cls: 'inc', text: `${sign}${diff}` }
        : { cls: 'dec', text: `${diff}` };
    }
    if (prev === curr) return { cls: 'same', text: '—' };
    return { cls: 'inc', text: '변경' };
  }
}

/* ────────────────────────────────────────────────
   VisualizerApp  (진입점)
──────────────────────────────────────────────── */
class VisualizerApp {
  constructor() {
    this._dataManager    = new DataManager();
    this._sidebarManager = new SidebarManager((varName) => this._onVarSelected(varName));
    this._timelineViewer = new TimelineViewer();
    // VS Code Webview API (확장에서 주입)
    this._vscode = (typeof acquireVsCodeApi !== 'undefined') ? acquireVsCodeApi() : null;
  }

  init() {
    this._bindEvents();
    this._setStatus('로드 중', 'loading');
    this.sendMessageToBackend({ command: CommandTypes.UI_READY, payload: {} });
  }

  // ── 이벤트 바인딩 ──
  _bindEvents() {
    window.addEventListener('message', (e) => {
      this.handleMessageFromBackend(e.data);
    });
  }

  // ── 백엔드 → 프론트 ──
  handleMessageFromBackend(message) {
    if (!message || !message.command) return;
    switch (message.command) {
      case CommandTypes.UPDATE_ALL_DATA:
        this._dataManager.updateData(message.payload);
        this._sidebarManager.renderSidebar(this._dataManager.getGroupedData());
        this._setStatus('연결됨', 'connected');

        // 이전에 선택된 변수가 있으면 갱신
        if (this._dataManager.currentVarName) {
          this._renderTimeline(this._dataManager.currentVarName);
        }
        break;

      default:
        console.warn('[VML] 알 수 없는 command:', message.command);
    }
  }

  // ── 프론트 → 백엔드 ──
  sendMessageToBackend(message) {
    if (this._vscode) {
      this._vscode.postMessage(message);
    } else {
      // 개발 환경 (브라우저) fallback
      console.log('[VML → Backend]', message);
    }
  }

  // ── 변수 선택 ──
  _onVarSelected(varName) {
    this._dataManager.currentVarName = varName;
    this._renderTimeline(varName);
    this.sendMessageToBackend({
      command: CommandTypes.VARIABLE_CHANGED,
      payload: { varName }
    });
  }

  _renderTimeline(varName) {
    const result = this._dataManager.getTimelineByVar(varName);
    if (!result) { this._timelineViewer.clearTimeline(); return; }
    const scope = this._dataManager.getScopeByVar(varName);
    this._timelineViewer.renderHeader(varName, scope);
    this._timelineViewer.renderTimeline(result.history);
  }

  _setStatus(text, cls) {
    const el = document.getElementById('status-badge');
    el.textContent = text;
    el.className = cls || '';
  }
}

/* ────────────────────────────────────────────────
   Bootstrap
──────────────────────────────────────────────── */
const app = new VisualizerApp();
app.init();

/* ────────────────────────────────────────────────
   개발/데모용 목업 데이터 주입
   (실제 확장에서는 백엔드가 postMessage로 전달)
──────────────────────────────────────────────── */
(function injectMockData() {
  if (typeof acquireVsCodeApi !== 'undefined') return; // 실제 확장 환경에선 스킵
  setTimeout(() => {
    window.dispatchEvent(new MessageEvent('message', {
      data: {
        command: 'UPDATE_ALL_DATA',
        payload: {
          'main()': [
            {
              varName: 'count', type: 'int', scope: 'main()',
              history: [
                { step: 1, line: 5,  value: 0  },
                { step: 2, line: 8,  value: 1  },
                { step: 3, line: 8,  value: 2  },
                { step: 4, line: 12, value: 5  },
                { step: 5, line: 15, value: 3  },
              ]
            },
            {
              varName: 'total', type: 'float', scope: 'main()',
              history: [
                { step: 1, line: 6,  value: 0.0   },
                { step: 2, line: 9,  value: 3.14  },
                { step: 3, line: 13, value: 6.28  },
                { step: 4, line: 17, value: 9.42  },
              ]
            },
            {
              varName: 'name', type: 'str', scope: 'main()',
              history: [
                { step: 1, line: 7,  value: 'Alice'   },
                { step: 2, line: 20, value: 'Bob'     },
                { step: 3, line: 25, value: 'Charlie' },
              ]
            },
          ],
          'calculate(x, y)': [
            {
              varName: 'result', type: 'int', scope: 'calculate(x, y)',
              history: [
                { step: 1, line: 32, value: 0   },
                { step: 2, line: 35, value: 42  },
                { step: 3, line: 38, value: -7  },
