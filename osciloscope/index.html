<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 사용자 코드를 로드하는 웹뷰이므로 CSP를 명시한다 (설계문서 5.3).
     script-src를 cspSource로 묶으면 우리 스크립트와 도구 파일은 로드되지만
     인라인 스크립트는 차단된다 — 로그 값에 섞인 script 태그나 onerror= 속성이 실행되지 않는다.
     {{cspSource}}는 WebviewSupport.injectCspSource가 채운다. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src {{cspSource}};
  style-src  {{cspSource}} 'unsafe-inline';
  img-src    {{cspSource}} data:;
  font-src   {{cspSource}};
  connect-src 'none';">
<title>OsciloScope</title>
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/timeline.css">
</head>
<body>

<!-- 우리가 그리는 것은 헤더뿐이다. 그 아래 전 영역이 도구 몫 (설계문서 4.4) -->
<div class="hdr">
  <span class="path" id="hdrPath"><span class="none">로그 파일 미선택</span></span>
  <span class="tool" id="hdrTool"></span>
  <div class="badge waiting" id="badge">대기 중</div>
</div>

<!-- host.mount — 도구가 전부 그린다 -->
<div id="pluginRoot"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
